services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: t-educare-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword123!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - sqlserver_data:/var/opt/mssql

  app:
    build:
      context: .
    container_name: t-educare-backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=teducare_db;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: "sa"
      DB_PASSWORD: "StrongPassword123!"
      JWT_SECRET: "super-secret-jwt-key-change-this-in-production"
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://t-educare.vercel.app"
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  sqlserver_data:
